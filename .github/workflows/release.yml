name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from plugin.yml
        id: version
        run: |
          echo "version=\$(grep "^version: " src/main/resources/plugin.yml | sed "s/version: //")" >> \$GITHUB_OUTPUT

      - name: Setup JDK 25
        run: |
          export JAVA_HOME=/root/.sdkman/candidates/java/25.0.3-tem
          echo "JAVA_HOME=\$JAVA_HOME" >> \$GITHUB_ENV
          echo "\$JAVA_HOME/bin" >> \$GITHUB_PATH

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR exists
        run: ls -la target/Sdf1_login.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v\${{ steps.version.outputs.version }}
          name: v\${{ steps.version.outputs.version }}
          files: target/Sdf1_login.jar
          generate_release_notes: true
