name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: ls -la target/*.jar

      - name: Create Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep "^version:" src/main/resources/plugin.yml | awk '{print $2}' | tr -d "\r\n ")
          TAG="v${VERSION}"
          BASE="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          echo "Version: ${VERSION}, Tag: ${TAG}"

          echo "=== Checking existing tag ${TAG} ==="
          RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Authorization: token $GITEA_TOKEN" \
            "${BASE}/releases/tags/${TAG}")
          HTTP_CODE=$(echo "$RESP" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)

          if [ "$HTTP_CODE" = "200" ]; then
            OLD_ID=$(echo "$RESP" | head -1 | grep -o "\"id\":[0-9]*" | head -1 | cut -d: -f2)
            curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "${BASE}/releases/${OLD_ID}"
            curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "${BASE}/tags/${TAG}"
            sleep 1
          fi

          echo "=== Creating release ${TAG} ==="
          RELEASE_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Sdf1_login ${TAG}\",\"body\":\"Version: ${VERSION}\",\"draft\":false,\"prerelease\":false}" \
            "${BASE}/releases")
          RELEASE_HTTP=$(echo "$RELEASE_RESP" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
          echo "Create release HTTP: ${RELEASE_HTTP}"

          if [ "$RELEASE_HTTP" != "201" ]; then
            echo "Release creation failed!"
            echo "$RELEASE_RESP" | head -1
            exit 1
          fi

          RELEASE_ID=$(echo "$RELEASE_RESP" | head -1 | grep -o "\"id\":[0-9]*" | head -1 | cut -d: -f2)
          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@target/Sdf1_login.jar" \
            "${BASE}/releases/${RELEASE_ID}/assets"
          echo "Release ${TAG} created with JAR"
