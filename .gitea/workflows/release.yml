name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'zulu'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR exists
        run: ls -la target/Sdf1_login.jar
