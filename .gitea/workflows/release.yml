name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Create Release with JAR
        uses: gitea.com/actions/release-action@main
        with:
          tag_name: build-${{ gitea.run_number }}
          name: Build #${{ gitea.run_number }}
          files: |
            target/Sdf1_login.jar
          token: ${{ secrets.GITEA_TOKEN }}
