name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Build Tools
        run: |
          set -e
          # 1) 定位服务器已安装的最高版本 JDK —— 绝不安装新 JDK，避免版本冲突
          JAVA_HOME=$(ls -d /usr/lib/jvm/java-* 2>/dev/null | sort -V | tail -1)
          if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            JAVA_HOME=$(dirname $(dirname $(command -v java)))
          fi
          export JAVA_HOME
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "PATH=/opt/maven/bin:$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          echo "Using JAVA_HOME=$JAVA_HOME"
          java -version

          # 2) 确保 Maven 可用 —— 用官方二进制包安装，绕开 dnf 拉 java-17 与已装 JDK 的冲突
          if [ ! -x /opt/maven/bin/mvn ]; then
            echo "Maven not found, downloading official binary..."
            MAVEN_VER=3.9.9
            cd /tmp
            curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VER}/binaries/apache-maven-${MAVEN_VER}-bin.tar.gz" -o maven.tgz
            tar -xzf maven.tgz -C /opt
            ln -sfn /opt/apache-maven-${MAVEN_VER} /opt/maven
            rm -f maven.tgz
          fi
          /opt/maven/bin/mvn -version

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: ls -la target/*.jar

      - name: Create Release via API
        run: |
          TAG="build-${{ gitea.run_number }}"
          BASE="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"

          # 创建 tag
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${{ gitea.sha }}\"}" \
            "${BASE}/tags" || true

          # 创建 release
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"Build ${{ gitea.run_number }}\",
              \"body\": \"Auto release from Gitea Actions\\n\\nCommit: ${{ gitea.sha }}\\nBranch: ${{ gitea.ref_name }}\",
              \"draft\": false,
              \"prerelease\": false
            }" \
            "${BASE}/releases"

          # 上传 JAR 资产
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            "${BASE}/releases/tags/${TAG}" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          if [ -n "$RELEASE_ID" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -F "attachment=@target/Sdf1_login.jar" \
              "${BASE}/releases/${RELEASE_ID}/assets"
            echo "Release created: ${TAG}"
          else
            echo "Warning: Release creation may have failed"
          fi
