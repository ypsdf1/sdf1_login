name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: ls -la target/*.jar

      - name: Create Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ gitea.run_number }}"
          BASE="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"

          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Build ${{ gitea.run_number }}\",\"body\":\"Commit: ${{ gitea.sha }}\nBranch: ${{ gitea.ref_name }}\",\"draft\":false,\"prerelease\":false}" \
            "${BASE}/releases"

          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITEA_TOKEN" \
            "${BASE}/releases/tags/${TAG}" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          if [ -n "$RELEASE_ID" ]; then
            curl -s -X POST \
              -H "Authorization: token $GITEA_TOKEN" \
              -F "attachment=@target/Sdf1_login.jar" \
              "${BASE}/releases/${RELEASE_ID}/assets"
            echo "Release ${TAG} created with JAR"
          else
            echo "Release tag ${TAG} created (JAR attach may need manual check)"
          fi
