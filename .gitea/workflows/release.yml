name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR exists
        run: |
          ls -la target/Sdf1_login.jar
          echo "Build successful! JAR size: $(du -h target/Sdf1_login.jar | cut -f1)"

  release:
    needs: build
    runs-on: self-hosted
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'zulu'

      - name: Rebuild for release
        run: mvn -B clean package -DskipTests

      - name: Create Release
        uses: gitea.com/actions/release-action@v4
        with:
          token: d84d235dfd3c3447cc9be12666639f7bb44df293
          tag_name: build-${{ gitea.run_number }}
          name: Release build-${{ gitea.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: target/Sdf1_login.jar
          body: |
            ## Auto Release build-${{ gitea.run_number }}

            Commit: ${{ gitea.sha }}
            Branch: ${{ gitea.ref_name }}

            ### 下载
            - `Sdf1_login.jar` - 插件JAR包
