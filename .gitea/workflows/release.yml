name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Build Tools
        run: |
          set -e
          # 1) 定位服务器已安装的最高版本 JDK —— 绝不安装新 JDK，避免版本冲突
          # 优先检查 sdkman 管理的 JDK
          if [ -f "$HOME/.sdkman/bin/sdkman-init.sh" ]; then
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk list java 2>/dev/null | grep installed | tail -1 | awk '{print $NF}' | xargs sdk use java 2>/dev/null || true
          fi

          # 检查 /usr/lib/jvm 下的 JDK
          JAVA_HOME=""
          if [ -d "/usr/lib/jvm" ]; then
            # 尝试找 Java 25
            JAVA_HOME=$(find /usr/lib/jvm -name "java-*25*" -type d -print 2>/dev/null | head -1)
            # 如果没有 Java 25，找最高版本
            if [ -z "$JAVA_HOME" ]; then
              JAVA_HOME=$(ls -d /usr/lib/jvm/java-* 2>/dev/null | sort -V | tail -1)
            fi
          fi

          # 如果还没找到，用 which java 定位
          if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            JAVA_HOME=$(dirname $(dirname $(command -v java)))
          fi

          export JAVA_HOME
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME"

          # 2) 确保 Maven 可用 —— 优先用系统已安装的（sdkman/dnf），没有才下载二进制
          MVN_BIN=""
          if command -v mvn >/dev/null 2>&1; then
            MVN_BIN=$(command -v mvn)
            echo "Maven found in PATH: $MVN_BIN"
          elif [ -x /opt/maven/bin/mvn ]; then
            MVN_BIN=/opt/maven/bin/mvn
            echo "Maven found at /opt/maven"
          fi

          if [ -z "$MVN_BIN" ]; then
            echo "Maven not found, downloading binary (aliyun mirror)..."
            MAVEN_VER=3.9.9
            cd /tmp
            curl -fsSL --connect-timeout 15 --max-time 120 \
              "https://mirrors.aliyun.com/apache/maven/maven-3/${MAVEN_VER}/binaries/apache-maven-${MAVEN_VER}-bin.tar.gz" \
              -o maven.tgz || \
            curl -fsSL --connect-timeout 15 --max-time 120 \
              "https://dlcdn.apache.org/maven/maven-3/${MAVEN_VER}/binaries/apache-maven-${MAVEN_VER}-bin.tar.gz" \
              -o maven.tgz
            tar -xzf maven.tgz -C /opt
            ln -sfn /opt/apache-maven-${MAVEN_VER} /opt/maven
            rm -f maven.tgz
            MVN_BIN=/opt/maven/bin/mvn
          fi

          # 把 Maven 所在目录加入 PATH
          MVN_DIR=$(dirname "$MVN_BIN")
          echo "PATH=$MVN_DIR:$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          echo "Java version:"
          java -version
          echo "Maven version:"
          "$MVN_BIN" -version

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: ls -la target/*.jar

      - name: Create Release via API
        run: |
          TAG="build-${{ gitea.run_number }}"
          BASE="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"

          # 创建 tag
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"refs/tags/${TAG}\",\"sha\":\"${{ gitea.sha }}\"}" \
            "${BASE}/tags" || true

          # 创建 release
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"Build ${{ gitea.run_number }}\",
              \"body\": \"Auto release from Gitea Actions\\n\\nCommit: ${{ gitea.sha }}\\nBranch: ${{ gitea.ref_name }}\",
              \"draft\": false,
              \"prerelease\": false
            }" \
            "${BASE}/releases"

          # 上传 JAR 资产
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}" \
            "${BASE}/releases/tags/${TAG}" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          if [ -n "$RELEASE_ID" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}" \
              -F "attachment=@target/Sdf1_login.jar" \
              "${BASE}/releases/${RELEASE_ID}/assets"
            echo "Release created: ${TAG}"
          else
            echo "Warning: Release creation may have failed"
          fi
