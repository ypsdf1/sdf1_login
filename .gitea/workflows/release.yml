name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup JDK 25
        run: |
          echo "Setting up JDK 25..."
          apt-get update -qq
          apt-get install -y -qq wget unzip
          wget -q https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse?project=jdk -O /tmp/jdk25.tar.gz
          tar -xzf /tmp/jdk25.tar.gz -C /opt
          export JAVA_HOME=$(ls -d /opt/jdk-25* | head -1)
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "JDK 25 installed: $($JAVA_HOME/bin/java -version 2>&1 | head -1)"
          echo "Setup completed"

      - name: Setup Maven
        run: |
          echo "Setting up Maven..."
          apt-get install -y -qq maven
          echo "Maven version: $(mvn -version 2>&1 | head -1)"
          echo "Setup completed"

      - name: Checkout code
        run: |
          echo "Checking out code..."
          GIT_HOST=${GITHUB_SERVER_URL#http://}
          GIT_HOST=${GIT_HOST#https://}
          rm -rf /workspace/youpaishidifu/Sdf1_login/*
          rm -rf /workspace/youpaishidifu/Sdf1_login/.[!.]*
          git clone "http://${GIT_HOST}/$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]').git" .
          echo "Checkout completed"

      - name: Build with Maven
        run: |
          echo "Building with Maven..."
          mvn -B clean package -DskipTests
          echo "Build completed"

      - name: Verify JAR
        run: |
          echo "Verifying JAR..."
          ls -la target/*.jar
          echo "Verification completed"

      - name: Create Release
        env:
          GITEA_TOKEN: 2cb4826439e13d6f80776bf1e5832a88669856e2
        run: |
          set -e
          VERSION=$(grep "^version:" src/main/resources/plugin.yml | awk '{print $2}' | tr -d '\r\n ')
          TAG="v$VERSION"
          BASE="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          echo "Version: $VERSION, Tag: $TAG"
          
          echo "=== Checking existing tag $TAG ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GITEA_TOKEN" "$BASE/releases/tags/$TAG")
          echo "Check tag HTTP: $HTTP_CODE"
          
          RELEASE_ID=""
          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID=$(curl -s -H "Authorization: token $GITEA_TOKEN" "$BASE/releases/tags/$TAG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            echo "Tag $TAG exists (release #$RELEASE_ID), deleting..."
            curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "$BASE/releases/$RELEASE_ID"
            curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "$BASE/tags/$TAG"
            sleep 1
          fi
          
          echo "=== Creating release ==="
          RESP=$(curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            "$BASE/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Auto release by Gitea Actions\",\"draft\":false,\"prerelease\":false}")
          RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          echo "Created release #$RELEASE_ID"
          
          echo "=== Uploading artifact ==="
          JAR=$(ls target/*.jar | head -1)
          UPLOAD_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/jar" \
            "$BASE/releases/$RELEASE_ID/assets?name=$(basename $JAR)" \
            --data-binary "@$JAR")
          echo "Upload HTTP: $UPLOAD_CODE"
          
          echo "=== Release $TAG created successfully ==="
