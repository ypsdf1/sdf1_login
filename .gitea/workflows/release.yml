name: Auto Release

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: ls -la target/Sdf1_login.jar

      - name: Create Release
        uses: gitea.com/actions/release-action@v4
        with:
          token: d84d235dfd3c3447cc9be12666639f7bb44df293
          tag_name: build-${{ gitea.run_number }}
          name: Build ${{ gitea.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: target/Sdf1_login.jar
          body: |
            Commit: ${{ gitea.sha }}
            Branch: ${{ gitea.ref_name }}
